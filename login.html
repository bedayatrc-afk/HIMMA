
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | هِمّة</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h2>هِمّة <span>HIMMA</span></h2>
        <a href="index.html" class="back-home">العودة للرئيسية</a>
    </header>

    <main class="login-container">

        <div class="login-card">

            <h1>مرحباً بعودتك</h1>
            <p>سجل دخولك وواصل طريق الإنجاز</p>

            <form>
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="أدخل بريدك الإلكتروني" required>

                <label>كلمة المرور</label>
                <input type="password" placeholder="أدخل كلمة المرور" required>

                <button type="submit">تسجيل الدخول</button>
            </form>

            <p class="login-note">
                هِمّة | كل يوم إنجاز جديد
            </p>

        </div>

    </main>

</body>
</html>
